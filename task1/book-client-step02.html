<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book HTML FORM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    h2 {
      color: #444;
    }
    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: 0 auto;
      gap: 10px;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <h1>Book Html Form</h1>

  <div>
    <h2>책 등록</h2>
    <form>
      <label for="title">제목:</label>
      <input type="text" name="title" id="title" required>

      <label for="author">저자:</label>
      <input type="text" name="author" id="author" required>

      <label for="isbn">ISBN:</label>
      <input type="text" name="isbn" id="isbn" required>

      <label for="price">가격:</label>
      <input type="text" name="price" id="price" required>

      <label for="publishDate">출판일:</label>
      <input type="date" name="publishDate" id="publishDate" required>

      <button type="submit">등록</button>
      <button type="reset">초기화</button>
    </form>
  </div>

  <h2>등록된 책 목록</h2>
  <table>
    <thead>
      <tr>
        <th>제목</th>
        <th>저자</th>
        <th>ISBN</th>
        <th>가격</th>
        <th>출판일</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>예제 도서</td>
        <td>홍길동</td>
        <td>123-4567890123</td>
        <td>15000</td>
        <td>2025-08-26</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
